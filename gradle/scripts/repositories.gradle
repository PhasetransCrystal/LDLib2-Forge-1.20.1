repositories {
    // Local and first-party artifacts.
    mavenLocal()
    flatDir {
        dir "libs"
    }
    mavenCentral()
    maven {
        name = "Ptcrys Releases"
        url = uri("https://maven.ptcrys.net/releases")
    }
    maven {
        name = "Ptcrys Snapshots"
        url = uri("https://maven.ptcrys.net/snapshots")
    }
    maven {
        name = "Ptcrys Private"
        url = uri("https://maven.ptcrys.net/private")
        credentials {
            username = project.findProperty('ptcrysUsername')
            password = project.findProperty('ptcrysPassword')
        }
    }

    // Mod platforms and their compatibility libraries.
    maven {
        name = 'Modrinth'
        url = "https://api.modrinth.com/maven/"
        content {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository { maven { url = "https://cursemaven.com/" } }
        filter { includeGroup("curse.maven") }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
        }
    }
    exclusiveContent {
        forRepository { maven { url = "https://maven.tterrag.com/" } }
        filter { includeGroup("com.tterrag.registrate") }
    }
    // Additional mod repositories retained for optional integrations.
    maven {
        url "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        url "https://maven.blamejared.com/"
    }
    maven {
        url "https://maven.izzel.io/"
    }
    maven {
        url "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        url "https://maven.parchmentmc.org"
    }
    maven {
        url "https://maven.architectury.dev/"
    }
    maven {
        url "https://maven.teamresourceful.com/repository/maven-public/"
    }
    maven {
        url "https://maven.jt-dev.tech/releases/"
    }
    maven {
        url "https://mvnrepository.com/artifact/com.hollingsworth.ars_nouveau"
    }
    maven {
        url "https://maven.bawnorton.com/releases"
    }
    maven {
        url "https://maven.enjarai.dev/mirrors"
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"

        content {
            includeGroup "net.blay09.mods"
        }
    }
    maven {
        name 'Configuration'
        url 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://jitpack.io/" }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
}
