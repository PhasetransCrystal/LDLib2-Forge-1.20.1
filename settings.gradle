pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases"}
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = "${mod_id}-forge"

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            //修改此处修改NeoForge版本
            version("modDevGradleLegacy", "[6.0,6.2)")
            plugin("modDevGradleLegacy", "net.minecraftforge.gradle").versionRef("modDevGradleLegacy")

            version("kotlinDevGradleLegacy", "2.1.0")
            plugin("kotlinDevGradleLegacy", "org.jetbrains.kotlin.jvm").versionRef("kotlinDevGradleLegacy")

            version("lombokLegacy", "9.2.0")
            plugin("lombokLegacy", "io.freefair.lombok").versionRef("lombokLegacy")

            version("kotlinLombokLegacy", "2.1.20")
            plugin("kotlinLombokLegacy", "org.jetbrains.kotlin.plugin.lombok").versionRef("kotlinLombokLegacy")

            version("spotless", "8.0.0")
            version("jetbrains-annotations", "26.0.2")
            plugin("spotless", "com.diffplug.spotless").versionRef("spotless")
            library("jetbrains-annotations", "org.jetbrains", "annotations").versionRef("jetbrains-annotations")
        }
    }
}